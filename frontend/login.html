
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vitalia | Ingresar y registrarse</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="pagina-auth">

    <!-- Encabezado -->
    <header class="navbar bg-white border-bottom sticky-top">
        <div class="container py-3">

            <a class="navbar-brand d-flex align-items-center gap-3"
               href="index.html">

                <img src="assets/img/logo-vitalia.png"
                     alt=""
                     class="logo-vitalia">

                <img src="assets/img/nombre-vitalia.png"
                     alt="Vitalia"
                     class="nombre-vitalia">
            </a>

            <div class="d-flex align-items-center gap-2">

                <a href="buscar.html?urgencias=true"
                   class="btn btn-urgencias rounded-pill">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    Urgencias 24 h
                </a>

                <button class="btn border-0"
                        type="button"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#menuVitalia"
                        aria-controls="menuVitalia"
                        aria-label="Abrir menú">
                    <i class="bi bi-list fs-2"></i>
                </button>

            </div>
        </div>
    </header>

    <!-- Menú lateral -->
    <div class="offcanvas offcanvas-end"
         tabindex="-1"
         id="menuVitalia">

        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold">
                Menú Vitalia
            </h5>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas"
                    aria-label="Cerrar menú">
            </button>
        </div>

        <div class="offcanvas-body">
            <nav class="nav flex-column menu-vitalia">

                <a href="index.html" class="menu-enlace">
                    <i class="bi bi-house-door"></i>
                    <span class="menu-texto">Inicio</span>
                </a>

                <a href="buscar.html" class="menu-enlace">
                    <i class="bi bi-search"></i>
                    <span class="menu-texto">
                        Buscar veterinarias
                    </span>
                </a>

                <a href="comunidad.html" class="menu-enlace">
                    <i class="bi bi-people"></i>
                    <span class="menu-texto">Comunidad</span>
                </a>

                <a href="negocios.html" class="menu-enlace">
                    <i class="bi bi-building"></i>
                    <span class="menu-texto">Para negocios</span>
                </a>

                <hr>

                <a href="mi-perfil.html" class="menu-enlace">
                    <i class="bi bi-person-circle"></i>
                    <span class="menu-texto">Mi perfil</span>
                </a>

                <a href="mis-mascotas.html" class="menu-enlace">
                    <i class="bi bi-heart"></i>
                    <span class="menu-texto">Mis mascotas</span>
                </a>

            </nav>
        </div>
    </div>

    <!-- Contenido -->
    <main class="auth-main">

        <section class="auth-card">

            <div class="auth-intro text-center">
                <div class="auth-icono">
                    <i class="bi bi-heart-pulse"></i>
                </div>

                <h1>Bienvenido a Vitalia</h1>

                <p>
                    Todo para el bienestar de tu mascota
                </p>
            </div>

            <!-- Pestañas -->
            <div class="auth-tabs" role="tablist"
                 aria-label="Acceso a Vitalia">

                <button type="button"
                        id="tabLogin"
                        class="auth-tab active"
                        role="tab"
                        aria-selected="true"
                        aria-controls="loginSection">
                    Ingresar
                </button>

                <button type="button"
                        id="tabRegistro"
                        class="auth-tab"
                        role="tab"
                        aria-selected="false"
                        aria-controls="registroSection">
                    Registrarse
                </button>

            </div>

            <!-- Iniciar sesión -->
            <section id="loginSection"
                     role="tabpanel"
                     aria-labelledby="tabLogin">

                <div id="loginMensaje"
                     class="auth-mensaje"
                     role="status"
                     aria-live="polite"
                     hidden>
                </div>

                <form id="formLogin">

                    <div class="mb-3">
                        <label for="loginCorreo"
                               class="form-label">
                            Correo electrónico
                        </label>

                        <input type="email"
                               id="loginCorreo"
                               class="form-control"
                               placeholder="tu@correo.com"
                               autocomplete="email"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="loginPassword"
                               class="form-label">
                            Contraseña
                        </label>

                        <input type="password"
                               id="loginPassword"
                               class="form-control"
                               placeholder="Tu contraseña"
                               autocomplete="current-password"
                               required>
                    </div>

                    <button type="submit"
                            class="btn-auth w-100">
                        Ingresar
                        <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                </form>
            </section>

            <!-- Registro -->
            <section id="registroSection"
                     role="tabpanel"
                     aria-labelledby="tabRegistro"
                     hidden>

                <div class="selector-rol">
                    <button type="button"
                            class="rol-boton active"
                            data-rol="dueno"
                            aria-pressed="true">
                        <i class="bi bi-heart me-1"></i>
                        Soy dueño
                    </button>

                    <button type="button"
                            class="rol-boton"
                            data-rol="clinica"
                            aria-pressed="false">
                        <i class="bi bi-hospital me-1"></i>
                        Soy veterinaria
                    </button>
                </div>

                <div id="registroMensaje"
                     class="auth-mensaje"
                     role="status"
                     aria-live="polite"
                     hidden>
                </div>

                <!-- Registro dueño -->
                <form id="formRegistroDueno">

                    <div class="mb-3">
                        <label for="duenoNombre"
                               class="form-label">
                            Nombre completo
                        </label>
                        <input type="text"
                               id="duenoNombre"
                               class="form-control"
                               autocomplete="name"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="duenoTelefono"
                               class="form-label">
                            Teléfono
                        </label>
                        <input type="tel"
                               id="duenoTelefono"
                               class="form-control"
                               autocomplete="tel"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="duenoCorreo"
                               class="form-label">
                            Correo electrónico
                        </label>
                        <input type="email"
                               id="duenoCorreo"
                               class="form-control"
                               autocomplete="email"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="duenoPassword"
                               class="form-label">
                            Contraseña
                        </label>
                        <input type="password"
                               id="duenoPassword"
                               class="form-control"
                               autocomplete="new-password"
                               minlength="6"
                               required>

                        <div class="form-text">
                            Mínimo 6 caracteres, una mayúscula
                            y un número.
                        </div>
                    </div>

                    <button type="submit"
                            class="btn-auth w-100">
                        Crear cuenta de dueño
                    </button>

                </form>

                <!-- Registro veterinaria -->
                <form id="formRegistroClinica" hidden>

                    <div class="mb-3">
                        <label for="clinicaNombre"
                               class="form-label">
                            Nombre de la clínica
                        </label>
                        <input type="text"
                               id="clinicaNombre"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="clinicaResponsable"
                               class="form-label">
                            Médico responsable / Cédula
                        </label>
                        <input type="text"
                               id="clinicaResponsable"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="clinicaDireccion"
                               class="form-label">
                            Dirección
                        </label>
                        <input type="text"
                               id="clinicaDireccion"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="clinicaTelefono"
                               class="form-label">
                            Teléfono
                        </label>
                        <input type="tel"
                               id="clinicaTelefono"
                               class="form-control"
                               required>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox"
                               id="clinicaUrgencias"
                               class="form-check-input">

                        <label for="clinicaUrgencias"
                               class="form-check-label">
                            Ofrecemos urgencias 24 horas
                        </label>
                    </div>

                    <div class="mb-3">
                        <label for="clinicaCorreo"
                               class="form-label">
                            Correo institucional
                        </label>
                        <input type="email"
                               id="clinicaCorreo"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="clinicaPassword"
                               class="form-label">
                            Contraseña
                        </label>
                        <input type="password"
                               id="clinicaPassword"
                               class="form-control"
                               minlength="6"
                               required>

                        <div class="form-text">
                            Mínimo 6 caracteres, una mayúscula
                            y un número.
                        </div>
                    </div>

                    <button type="submit"
                            class="btn-auth w-100">
                        Registrar veterinaria
                    </button>

                </form>
            </section>

            <p class="auth-pie text-center">
                <i class="bi bi-shield-check me-1"></i>
                Tus mascotas, nuestra prioridad.
            </p>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
    <script src="js/menu.js"></script>

</body>
</html>
