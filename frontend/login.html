<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vítalia - Ingresar y Registrarse</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #F8F7F3;
            color: #2D2D2D;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px 30px;
            position: relative;
        }
        .top-left-logo {
            position: absolute;
            top: 22px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .top-left-logo svg {
            height: 44px;
            width: auto;
        }
        .container {
            background: #FFFFFF;
            padding: 36px 40px;
            border-radius: 20px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 8px 25px rgba(45, 45, 45, 0.05);
            width: 100%;
            max-width: 480px;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 22px;
        }
        .logo-area h1 {
            color: #2E7D6B;
            font-size: 28px;
            font-weight: 700;
        }
        .logo-area p {
            color: #6BAF8F;
            font-size: 13px;
        }
        .tabs {
            display: flex;
            margin-bottom: 22px;
            border-bottom: 2px solid #E2E8F0;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            transition: 0.2s;
        }
        .tab.active {
            color: #2E7D6B;
            font-weight: 600;
            border-bottom: 2px solid #2E7D6B;
            margin-bottom: -2px;
        }
        /* Selector de tipo de registro (Dueño vs Veterinaria) */
        .role-selector {
            display: flex;
            background-color: #F8F7F3;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #E2E8F0;
        }
        .role-pill {
            flex: 1;
            text-align: center;
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            color: #2D2D2D;
            transition: 0.2s;
        }
        .role-pill.active {
            background-color: #2E7D6B;
            color: #FFFFFF;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: 500;
            color: #2D2D2D;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background-color: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            color: #2D2D2D;
            transition: 0.2s;
        }
        .form-group input:focus {
            border-color: #2E7D6B;
            box-shadow: 0 0 0 3px rgba(107, 175, 143, 0.2);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            margin-bottom: 14px;
            color: #2D2D2D;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #2E7D6B;
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .btn:hover {
            background-color: #246355;
        }
        .form-section, .sub-form {
            display: none;
        }
        .form-section.active, .sub-form.active {
            display: block;
        }
        .alert-error {
            background-color: #FEF2F2;
            border: 1px solid #C84B3C;
            color: #991B1B;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
            display: none;
        }
        .helper-text {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <a href="carnet.html" class="top-left-logo">
        <svg viewBox="0 0 220 65" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 54C18 42 8 33 8 21C8 13 14 7 22 7C27 7 31 10 34 14C37 10 41 7 46 7C54 7 60 13 60 21C60 33 50 42 36 54L34 56L32 54Z" stroke="#2E7D6B" stroke-width="3.5" fill="none"/>
            <circle cx="52" cy="8" r="2.2" fill="#2E7D6B"/>
            <circle cx="57" cy="6" r="2.2" fill="#2E7D6B"/>
            <circle cx="62" cy="8" r="2.2" fill="#2E7D6B"/>
            <ellipse cx="57" cy="12" rx="4" ry="3" fill="#2E7D6B"/>
            <path d="M16 42C16 30 22 21 31 21C36 21 39 25 42 28L45 30C46 31 45 34 42 35L35 36C33 41 31 48 31 53L16 42Z" fill="#2E7D6B"/>
            <path d="M36 55L40 42L38 37L43 39L47 36L49 41C51 44 50 49 47 52L36 55Z" fill="#C49A76"/>
            <text x="72" y="42" fill="#2E7D6B" font-family="Poppins, sans-serif" font-weight="700" font-size="30">Vítalia</text>
        </svg>
    </a>

    <div class="container">
        <div class="logo-area">
            <h1>Vítalia</h1>
            <p>Todo para el bienestar de tu mascota</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Ingresar</div>
            <div class="tab" onclick="switchTab('register')">Registrarse</div>
        </div>

        <!-- 1. INICIAR SESIÓN -->
        <div id="login-section" class="form-section active">
            <div id="login-error" class="alert-error"></div>
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="login-email" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-login" class="btn">Ingresar</button>
            </form>
        </div>

        <!-- 2. REGISTRARSE (SEPARADO EN DUEÑO Y VETERINARIA) -->
        <div id="register-section" class="form-section">
            <div class="role-selector">
                <div class="role-pill active" onclick="switchRoleForm('dueno')">Soy Dueño</div>
                <div class="role-pill" onclick="switchRoleForm('veterinaria')">Soy Veterinaria</div>
            </div>

            <div id="register-error" class="alert-error"></div>

            <!-- SUB-FORMULARIO A: DUEÑO DE MASCOTA -->
            <form id="form-reg-dueno" class="sub-form active" onsubmit="handleRegister(event, 'dueno')">
                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" id="dueno-name" placeholder="Ej. Leslie Alvarado" required>
                </div>
                <div class="form-group">
                    <label>Teléfono de contacto</label>
                    <input type="tel" id="dueno-phone" placeholder="55 1234 5678" required>
                </div>
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="dueno-email" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="dueno-password" placeholder="••••••••" required>
                    <div class="helper-text">Mínimo 6 caracteres, una mayúscula y un número.</div>
                </div>
                <button type="submit" class="btn">Crear cuenta de Dueño</button>
            </form>

            <!-- SUB-FORMULARIO B: CLÍNICA VETERINARIA -->
            <form id="form-reg-vet" class="sub-form" onsubmit="handleRegister(event, 'clinica')">
                <div class="form-group">
                    <label>Nombre de la Clínica o Veterinaria</label>
                    <input type="text" id="vet-name" placeholder="Ej. Hospital Veterinario San Ángel" required>
                </div>
                <div class="form-group">
                    <label>Médico Responsable / Cédula Profesional</label>
                    <input type="text" id="vet-license" placeholder="Nombre del MVZ o No. de cédula" required>
                </div>
                <div class="form-group">
                    <label>Dirección de la clínica</label>
                    <input type="text" id="vet-address" placeholder="Calle, número, colonia y alcaldía" required>
                </div>
                <div class="form-group">
                    <label>Teléfono de atención / urgencias</label>
                    <input type="tel" id="vet-phone" placeholder="55 9876 5432" required>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="vet-24h">
                    <label for="vet-24h">Ofrecemos servicio de Urgencias 24 horas</label>
                </div>
                <div class="form-group">
                    <label>Correo institucional</label>
                    <input type="email" id="vet-email" placeholder="contacto@tuveterinaria.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="vet-password" placeholder="••••••••" required>
                    <div class="helper-text">Mínimo 6 caracteres, una mayúscula y un número.</div>
                </div>
                <button type="submit" class="btn">Registrar Clínica Veterinaria</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            const loginSection = document.getElementById('login-section');
            const registerSection = document.getElementById('register-section');
            const tabs = document.querySelectorAll('.tab');

            tabs.forEach(t => t.classList.remove('active'));
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('register-error').style.display = 'none';

            if (tabName === 'login') {
                loginSection.classList.add('active');
                registerSection.classList.remove('active');
                tabs[0].classList.add('active');
            } else {
                registerSection.classList.add('active');
                loginSection.classList.remove('active');
                tabs[1].classList.add('active');
            }
        }

        function switchRoleForm(role) {
            const pills = document.querySelectorAll('.role-pill');
            const formDueno = document.getElementById('form-reg-dueno');
            const formVet = document.getElementById('form-reg-vet');
            document.getElementById('register-error').style.display = 'none';

            pills.forEach(p => p.classList.remove('active'));
            if (role === 'dueno') {
                pills[0].classList.add('active');
                formDueno.classList.add('active');
                formVet.classList.remove('active');
            } else {
                pills[1].classList.add('active');
                formVet.classList.add('active');
                formDueno.classList.remove('active');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const errorBox = document.getElementById('login-error');
            const btn = document.getElementById('btn-login');

            errorBox.style.display = 'none';
            btn.innerText = 'Validando...';
            btn.disabled = true;

            try {
                await new Promise(resolve => setTimeout(resolve, 800));
                const role = email.includes("clinica") || email.includes("vet") ? "clinica" : "dueno";
                localStorage.setItem('token', 'jwt_vitalia_demo');
                localStorage.setItem('userRole', role);

                if (role === 'dueno') {
                    window.location.href = 'carnet.html';
                } else {
                    alert('Bienvenida Clínica Veterinaria. Redirigiendo a tu panel...');
                    btn.innerText = 'Ingresar';
                    btn.disabled = false;
                }
            } catch (error) {
                errorBox.innerText = 'Credenciales incorrectas.';
                errorBox.style.display = 'block';
                btn.innerText = 'Ingresar';
                btn.disabled = false;
            }
        }

        async function handleRegister(event, role) {
            event.preventDefault();
            const errorBox = document.getElementById('register-error');
            const password = role === 'dueno' 
                ? document.getElementById('dueno-password').value 
                : document.getElementById('vet-password').value;

            errorBox.style.display = 'none';
            const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{6,}$/;
            if (!passwordRegex.test(password)) {
                errorBox.innerText = 'La contraseña debe tener al menos 6 caracteres, una letra mayúscula y un número.';
                errorBox.style.display = 'block';
                return;
            }

            const btn = event.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = 'Registrando...';
            btn.disabled = true;

            await new Promise(resolve => setTimeout(resolve, 800));

            const msg = role === 'dueno'
                ? '¡Cuenta de dueño creada con éxito! Ya puedes iniciar sesión.'
                : '¡Clínica veterinaria registrada con éxito! Ya puedes iniciar sesión.';
            alert(msg);
            event.target.reset();
            btn.innerText = originalText;
            btn.disabled = false;
            switchTab('login');
        }
    </script>
</body>
</html>
