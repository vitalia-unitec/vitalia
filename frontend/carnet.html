<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vítalia - Carnet de mi mascota</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #F8F7F3;
            color: #2D2D2D;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .window-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 950px;
            border-radius: 24px;
            padding: 30px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }
        /* BARRA SUPERIOR DE NAVEGACIÓN */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .logo-group {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .logo-icon {
            width: 28px;
            height: 28px;
            background-color: #2E7D6B;
            border-radius: 50%;
        }
        .logo-text {
            color: #2E7D6B;
            font-size: 22px;
            font-weight: 700;
        }
        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }
        .nav-links a {
            text-decoration: none;
            color: #2D2D2D;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.8;
            transition: 0.2s;
        }
        .nav-links a.active, .nav-links a:hover {
            opacity: 1;
            font-weight: 600;
            border-bottom: 2px solid #2E7D6B;
            padding-bottom: 4px;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #E5E5E5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .user-avatar-nav {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #6BAF8F;
            object-fit: cover;
        }

        /* BOTÓN VOLVER Y TÍTULO */
        .back-link {
            display: inline-block;
            color: #666;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #2D2D2D;
            margin-bottom: 30px;
        }

        /* CONTENIDO DEL CARNET */
        .carnet-layout {
            display: grid;
            grid-template-columns: 160px 1fr 200px;
            gap: 30px;
            align-items: start;
        }
        @media (max-width: 850px) {
            .carnet-layout {
                grid-template-columns: 1fr;
            }
        }

        /* FOTO DE LA MASCOTA */
        .photo-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .photo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
        }
        .pet-photo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #F8F7F3;
            border: 1px solid #E5E5E5;
        }
        .upload-icon-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #FFFFFF;
            border: 1px solid #6BAF8F;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .change-photo-label {
            font-size: 13px;
            color: #2E7D6B;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }

        /* FORMULARIO */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field-group label {
            font-size: 12px;
            color: #666666;
            font-weight: 500;
        }
        .field-group input, .field-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            color: #2D2D2D;
            background-color: #FFFFFF;
            outline: none;
        }
        .field-group input:focus, .field-group select:focus {
            border-color: #6BAF8F;
        }

        /* BOTÓN PRINCIPAL */
        .submit-container {
            grid-column: span 2;
            margin-top: 10px;
        }
        .btn-submit {
            background-color: #2E7D6B;
            color: #FFFFFF;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover {
            background-color: #246355;
        }

        /* CUADRO WHATSAPP LATERAL */
        .whatsapp-card {
            background-color: #F8F7F3;
            border-radius: 16px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            gap: 20px;
            min-height: 220px;
        }
        .whatsapp-text {
            font-size: 13px;
            color: #2D2D2D;
            line-height: 1.5;
            font-weight: 500;
        }
        .whatsapp-icon-btn {
            width: 44px;
            height: 44px;
            background-color: #2E7D6B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .whatsapp-icon-btn:hover {
            background-color: #6BAF8F;
        }

        /* BARRA SECUNDARIA DE MÓDULOS DE EQUIPO */
        .team-toolbar {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dashed #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-mode-btn {
            background-color: #F8F7F3;
            border: 1px solid #6BAF8F;
            color: #2D2D2D;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }
        .action-mode-btn:hover {
            background-color: #6BAF8F;
            color: white;
        }
        .danger-text {
            color: #2E7D6B;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="window-card">
        
        <!-- NAVBAR -->
        <div class="navbar">
            <div class="nav-left">
                <a href="#" class="logo-group">
                    <div class="logo-icon"></div>
                    <span class="logo-text">Vítalia</span>
                </a>
                <ul class="nav-links">
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Servicios</a></li>
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">Para negocios</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <div class="icon-btn">🔔</div>
                <div class="user-avatar-nav"></div>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <a href="#" class="back-link">← Volver</a>
        <h1 class="page-title">Carnet de mi mascota</h1>

        <div class="carnet-layout">
            
            <!-- COLUMNA FOTO -->
            <div class="photo-column">
                <div class="photo-wrapper">
                    <!-- Foto de muestra o avatar predeterminado -->
                    <img id="pet-photo-preview" src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&q=80&w=300" class="pet-photo-img" alt="Mascota">
                    <label for="pet-photo-input" class="upload-icon-badge">🏠</label>
                </div>
                <input type="file" id="pet-photo-input" accept="image/*" style="display: none;" onchange="previewPhoto(event)">
                <label for="pet-photo-input" class="change-photo-label">Cambiar foto</label>
            </div>

            <!-- FORMULARIO 2 COLUMNAS -->
            <form id="pet-form" class="form-grid" onsubmit="event.preventDefault(); guardarMascota();">
                <div class="field-group">
                    <label>Nombre</label>
                    <input type="text" id="pet-name" value="Luna" required>
                </div>

                <div class="field-group">
                    <label>Sexo</label>
                    <select id="pet-gender" required>
                        <option value="Hembra" selected>Hembra</option>
                        <option value="Macho">Macho</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>Especie</label>
                    <select id="pet-species" required>
                        <option value="Perro" selected>Perro</option>
                        <option value="Gato">Gato</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>Edad</label>
                    <input type="text" id="pet-age" value="3 años" required>
                </div>

                <div class="field-group">
                    <label>Raza</label>
                    <input type="text" id="pet-breed" value="Golden Retriever" required>
                </div>

                <div class="field-group">
                    <label>Color</label>
                    <input type="text" id="pet-color" value="Dorado">
                </div>

                <div class="submit-container">
                    <button type="submit" id="btn-save-carnet" class="btn-submit">Guardar carnet</button>
                </div>
            </form>

            <!-- TARJETA LATERAL WHATSAPP -->
            <div class="whatsapp-card">
                <p class="whatsapp-text">
                    Este carnet se envía automáticamente en los mensajes de WhatsApp.
                </p>
                <a href="#" class="whatsapp-icon-btn" onclick="compartirWhatsApp(event)">
                    💬
                </a>
            </div>

        </div>

        <!-- MÓDULOS REQUERIDOS POR TU EQUIPO (CREAR, CONSULTAR, EDITAR, SEGURIDAD) -->
        <div class="team-toolbar">
            <div style="display: flex; gap: 8px;">
                <button class="action-mode-btn" onclick="crearCarnet()">+ Crear</button>
                <button class="action-mode-btn" onclick="consultarCarnet()">Consultar</button>
                <button class="action-mode-btn" onclick="editarCarnet()">Editar</button>
            </div>
            <div>
                <span class="danger-text" onclick="cambiarPassword()">Cambiar contraseña</span> | 
                <span class="danger-text" onclick="eliminarCuenta()">Eliminar cuenta</span>
            </div>
        </div>

    </div>

    <script>
        const inputs = document.querySelectorAll('#pet-form input, #pet-form select');
        const btnSave = document.getElementById('btn-save-carnet');

        // Previsualizar Foto cargada
        function previewPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('pet-photo-preview').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        // Acciones del equipo (Crear, Consultar, Editar)
        function crearCarnet() {
            document.getElementById('pet-form').reset();
            setFormState(false);
            btnSave.style.display = 'block';
            alert('Formulario listo para crear una nueva mascota.');
        }

        function consultarCarnet() {
            setFormState(true);
            btnSave.style.display = 'none';
            alert('Modo consulta: Campos deshabilitados.');
        }

        function editarCarnet() {
            setFormState(false);
            btnSave.style.display = 'block';
            alert('Modo edición activo.');
        }

        function setFormState(disabled) {
            inputs.forEach(input => input.disabled = disabled);
        }

        async function guardarMascota() {
            const name = document.getElementById('pet-name').value;
            btnSave.innerText = 'Guardando...';
            btnSave.disabled = true;

            await new Promise(r => setTimeout(r, 800));

            alert(`¡Carnet de ${name} guardado correctamente!`);
            btnSave.innerText = 'Guardar carnet';
            btnSave.disabled = false;
        }

        function compartirWhatsApp(e) {
            e.preventDefault();
            const name = document.getElementById('pet-name').value;
            const breed = document.getElementById('pet-breed').value;
            const mensaje = `¡Hola! Te comparto el carnet de mi mascota ${name} (${breed}) en Vítalia 🐾.`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        // FUNCIÓN CORREGIDA Y FUNCIONAL PARA CAMBIAR CONTRASEÑA
        function cambiarPassword() {
            const nuevaPass = prompt("Ingresa tu nueva contraseña (mínimo 6 caracteres):");
            if (nuevaPass !== null) {
                if (nuevaPass.trim().length >= 6) {
                    alert("¡Contraseña actualizada con éxito!");
                } else {
                    alert("La contraseña debe tener al menos 6 caracteres.");
                }
            }
        }

        function eliminarCuenta() {
            if (confirm("¿Estás segura de eliminar tu cuenta?")) {
                alert("Cuenta eliminada.");
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
